[project]
name = "synthetic-data-gen"
version = "0.1.0"
description = "Ollama-backed synthetic finance router dataset generation with observability."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [{ name = "Jaiydev Gupta" }]
keywords = ["finance", "synthetic-data", "ollama", "langsmith", "wandb", "routing"]
dependencies = [
  "datasets>=3.0.0",
  "deepagents>=0.1.0",
  "langchain-ollama>=0.2.0",
  "langsmith>=0.2.0",
  "numpy>=1.26.0",
  "rich>=13.0.0",
  "sentence-transformers>=3.0.0",
  "tqdm>=4.66.0",
  "wandb>=0.17.0",
]

[project.scripts]
synthetic-data-gen = "synthetic_data_gen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/synthetic_data_gen"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
